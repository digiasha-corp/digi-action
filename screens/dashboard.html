<div class="space-y-4">
  <!-- Banner Presensi Cepat -->
  <div class="bg-gradient-to-r from-emerald-600 to-teal-700 rounded-2xl p-3.5 text-white shadow-sm flex items-center justify-between gap-2">
    <div class="min-w-0">
      <span class="text-[10px] text-emerald-100 uppercase tracking-wider font-bold block" id="dash-presensi-status-label">Kehadiran Hari Ini</span>

    </div>
    <button type="button" id="dash-btn-presensi" onclick="openAbsenChoiceModal()" class="px-3.5 py-2 bg-white text-teal-800 hover:bg-emerald-50 rounded-xl text-xs font-bold shrink-0 shadow flex items-center space-x-1.5 transition active:scale-95">

      <span id="dash-btn-presensi-text">Presensi Online</span>
    </button>
  </div>

  <div>

      <!-- MENU IZIN (WFA, Datang Terlambat, Cuti, Sakit) -->
      <button id="menu-btn-izin" onclick="loadScreen('izin')" class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm text-left flex flex-col justify-between h-28 hover:border-teal-500 transition">
        <div class="w-9 h-9 rounded-xl bg-teal-50 text-teal-600 flex items-center justify-center text-base">
          <i class="fa-solid fa-file-signature"></i>
        </div>
        <div>

      <button id="menu-btn-persetujuan" onclick="loadScreen('persetujuan')" class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm text-left flex flex-col justify-between h-28 hover:border-indigo-500 transition relative">
        <div class="flex items-center justify-between">

        <div>

          <div class="text-[10px] text-slate-400 leading-tight">Pusat approval PIC & atasan</div>

      <button id="menu-btn-priority" onclick="loadScreen('priority')" class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm text-left flex flex-col justify-between h-28 hover:border-slate-400 transition">

          <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <div>
          <div class="text-xs font-bold text-slate-800">Priority Visit</div>
          <div class="text-[10px] text-slate-400 leading-tight">Scorecard & prioritas mitra</div>
        </div>
      </button>

      <button id="menu-btn-assignment" onclick="loadScreen('assignment')" class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm text-left flex flex-col justify-between h-28 hover:border-slate-400 transition">
        <div class="w-9 h-9 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center text-base">
          <i class="fa-solid fa-bullhorn"></i>
        </div>
        <div>
          <div class="text-xs font-bold text-slate-800">Assign Concern</div>
          <div class="text-[10px] text-slate-400 leading-tight">Tandai concern visit mitra</div>
        </div>
      </button>

      <button id="menu-btn-visit" onclick="loadScreen('visit')" class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm text-left flex flex-col justify-between h-28 hover:border-slate-400 transition">

      <button id="menu-btn-pipeline" onclick="loadScreen('pipeline')" class="bg-white p-3.5 rounded-2xl border border-teal-200 shadow-sm text-left flex flex-col justify-between h-28 hover:border-teal-400 transition">

          <div class="text-[10px] text-slate-400 leading-tight">Progres & folder dokumen</div>

      <button id="menu-btn-gps" onclick="loadScreen('gps')" class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm text-left flex flex-col justify-between h-28 hover:border-slate-400 transition">
        <div class="w-9 h-9 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-base">
          <i class="fa-solid fa-satellite-dish"></i>
        </div>
        <div>
          <div class="text-xs font-bold text-slate-800">GPS Maintenance</div>
          <div class="text-[10px] text-slate-400 leading-tight">Pasang / ganti / cabut GPS</div>
        </div>
      </button>

      <button id="menu-btn-fac" onclick="loadScreen('fac')" class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm text-left flex flex-col justify-between h-28 hover:border-slate-400 transition">

        </div>
        <div>
          <div class="text-xs font-bold text-slate-800">Laporan GPS (FAC)</div>
          <div class="text-[10px] text-slate-400 leading-tight">Monitoring sinyal harian</div>

      <button id="menu-btn-history" onclick="loadScreen('history')" class="bg-white p-3.5 rounded-2xl border border-orange-200 shadow-sm text-left flex flex-col justify-between h-28 hover:border-orange-400 transition">

          <i class="fa-solid fa-clock-rotate-left"></i>

        <div>
          <div class="text-xs font-bold text-slate-800">Riwayat Aktivitas</div>
          <div class="text-[10px] text-slate-400 leading-tight">Log visit, calon mitra & GPS</div>

      <button id="menu-btn-settings" onclick="loadScreen('settings')" class="bg-white p-3.5 rounded-2xl border border-indigo-200 shadow-sm text-left flex flex-col justify-between h-28 hover:border-indigo-400 transition">

        <div>
          <div class="text-xs font-bold text-slate-800">Pengaturan (Admin)</div>
          <div class="text-[10px] text-slate-400 leading-tight">Kelola Akun, Area & GPS</div>
        </div>
