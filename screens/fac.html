<div class="space-y-3">
  <!-- Bar Legenda & Filter Status -->
  <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm space-y-2">
    <div class="flex items-center justify-between border-b border-slate-100 pb-1.5">
      <span class="text-[11px] font-bold text-slate-800">Legenda & Filter Status:</span>
      <button type="button" onclick="clearAllStatusFilters()"
        class="text-[10px] font-bold text-cyan-700 hover:underline">Reset Filter</button>
    </div>
    <div class="grid grid-cols-4 sm:grid-cols-7 gap-1.5" id="legend-filter-container"></div>
  </div>

  <!-- Search & Tab Filter Kontrak -->
  <div class="bg-white p-2.5 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-2">
    <div class="relative flex-1">
      <input type="text" id="fac-search-input" oninput="filterFacReportList()"
        placeholder="Cari Mitra atau Kendaraan..."
        class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2 pl-7 text-xs font-semibold focus:ring-2 focus:ring-cyan-700" />
      <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2.5 text-slate-400 text-xs"></i>
    </div>
    <div class="flex space-x-1 text-[10px] shrink-0">
      <button type="button" onclick="setFacContractFilter('ALL')" id="filter-btn-all"
        class="fac-filter-btn px-2.5 py-1.5 rounded-lg font-bold bg-slate-900 text-white">Semua</button>
      <button type="button" onclick="setFacContractFilter('LIVE')" id="filter-btn-live"
        class="fac-filter-btn px-2.5 py-1.5 rounded-lg font-semibold bg-slate-100 text-slate-600">Live</button>
      <button type="button" onclick="setFacContractFilter('EXPIRED')" id="filter-btn-expired"
        class="fac-filter-btn px-2.5 py-1.5 rounded-lg font-semibold bg-slate-100 text-slate-600">Expired</button>
    </div>
  </div>

  <!-- List Kartu Kendaraan -->
  <div id="fac-vehicle-list-container" class="space-y-2"></div>

  <!-- Tombol Submit Sticky di Bawah -->
  <div class="sticky bottom-3 z-30 pt-2">
    <button type="button" onclick="submitFacGpsReport()" id="btn-submit-fac"
      class="w-full py-3.5 bg-cyan-800 hover:bg-cyan-900 text-white font-bold rounded-2xl text-sm shadow-xl flex items-center justify-center space-x-2 transition">
      <i class="fa-solid fa-floppy-disk"></i>
      <span>Simpan Laporan & WhatsApp</span>
    </button>
  </div>
</div>
